name: "collabwrite-api"
services:
  postgres:
    image: postgres:18
    container_name: collabwrite_db
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "$POSTGRES_PORT:$POSTGRES_PORT"
    volumes:
      - db:/var/lib/postgres
  
  express:
    container_name: collabwrite_api
    build: .
    depends_on:
      - postgres
    ports:
      - "$EXPRESS_PORT:$EXPRESS_PORT"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env

volumes:
  node_modules:
  db: